[project]
name = "edgesar-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5", "shapely==2.1.2", "websockets==16.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps.api*", "packages*"]
